:root{
  --page:#F2F4F7; --panel:#FFFFFF; --panel2:#F7F9FB; --line:#DDE3EA; --line2:#EAEEF3;
  --ink:#0A1220; --ink2:#3E4C60; --mute:#71809A;
  --ice:#0A8DA1; --rosa:#C9265F; --icebg:rgba(10,141,161,.09); --rosabg:rgba(201,38,95,.08);
  --s1:#0A8DA1; --s2:#C9265F; --s3:#8A6100; --s4:#1B7A43; --s5:#6D5AE6;
  --good:#157A3B; --warn:#8A6100; --bad:#C03A38;
  --goodbg:rgba(21,122,59,.09); --warnbg:rgba(138,97,0,.09); --badbg:rgba(192,58,56,.08);

}

}}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--page);color:var(--ink);
  font:15px/1.55 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.disp{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.eyebrow{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--mute);font-weight:500}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.wrap{max-width:1720px;margin:0 auto;padding:0 clamp(14px,2.5vw,40px)}

/* ---------- header ---------- */
header.hq{border-bottom:1px solid var(--line);background:var(--panel2)}
.hq-in{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 0 14px;flex-wrap:wrap;
  background:var(--hero-grad);background-size:100% 100%}
.hq h1{font-family:"Barlow Condensed";font-weight:700;font-size:clamp(30px,3.4vw,46px);line-height:.95;
  margin:4px 0 2px;text-transform:uppercase}
.hq h1 .sl{color:var(--rosa)} .hq h1 .yr{color:var(--ice)}
.hq .sub{font-size:13px;color:var(--ink2);max-width:64ch}
.hq-right{display:flex;align-items:flex-start;gap:14px;margin-left:auto}
.count{text-align:right}
.count .n{font-family:"Barlow Condensed";font-weight:700;font-size:clamp(38px,3.6vw,54px);line-height:.9;
  font-variant-numeric:normal}
.count .l{font-size:10.5px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;
  font-family:"JetBrains Mono",monospace;margin-top:3px}
.theme-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;
  padding:8px 13px;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink2);background:var(--panel)}
.theme-btn:hover{border-color:var(--ice);color:var(--ink)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border-radius:999px;padding:4px 11px;white-space:nowrap;border:1px solid}
.chip.ice{color:var(--ice);border-color:var(--ice);background:var(--icebg)}
.chip.rosa{color:var(--rosa);border-color:var(--rosa);background:var(--rosabg)}
.chip.mute{color:var(--mute);border-color:var(--line);background:transparent}
.chip.good{color:var(--good);border-color:var(--good);background:var(--goodbg)}
.chip.warn{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
.chip.bad{color:var(--bad);border-color:var(--bad);background:var(--badbg)}

/* ---------- stale-data banner ---------- */
.databar{border-bottom:1px solid var(--warn);background:var(--warnbg)}
.databar-in{display:flex;align-items:center;gap:10px;padding:9px 0;flex-wrap:wrap}
.databar .ic{font-size:14px;line-height:1}
.databar .msg{font-size:12.5px;color:var(--ink);font-weight:500}
.databar .msg b{font-weight:700}
.databar .fix{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--warn);margin-left:auto;white-space:nowrap}
/* critical variant — feed actually down (token expired), not just drifting */
.databar.crit{border-bottom-width:2px;border-bottom-color:var(--bad);background:var(--badbg)}
.databar.crit .ic{font-size:15px}
.databar.crit .fix{color:var(--bad)}

/* ---------- lap / interval breakdown ---------- */
.lapdet{margin-top:9px;border-top:1px solid var(--line2);padding-top:8px}
.lapdet>summary{cursor:pointer;font-family:"Barlow Condensed";font-weight:600;font-size:15px;
  text-transform:uppercase;letter-spacing:.02em;color:var(--ink);list-style:none;line-height:1.3}
.lapdet>summary::-webkit-details-marker{display:none}
.lapdet>summary:hover{color:var(--ice)}
.lapdet table.data tr.workrow td{color:var(--ink);font-weight:700;
  background:color-mix(in srgb,var(--icebg) 55%,transparent)}
.lapkind{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.lapkind.work{color:var(--ice)} .lapkind.surge{color:var(--warn)}
.lapkind.easy,.lapkind.steady{color:var(--mute)}
.besteff{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:8px 0 2px}
.besteff .be-lbl{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute)}
.besteff .be-item{font-size:12px;color:var(--ink2)}
.besteff .be-item b{color:var(--ink);font-family:"Barlow Condensed";font-weight:600;font-size:13px}
.lapnote{font-size:11.5px;line-height:1.5;margin:7px 0 2px;padding:6px 9px;border-radius:7px}
.lapnote.ask{color:var(--warn);background:var(--warnbg);border:1px solid var(--warn)}
.lapnote.info{color:var(--mute);background:transparent}

/* ---------- nav ---------- */
nav.tabs{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--page) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{font-family:"Barlow Condensed";font-size:17.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--mute);padding:13px 15px 10px;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--ink);border-bottom-color:var(--rosa)}

/* ---------- layout ---------- */
main{padding:20px 0 70px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:20px 22px 16px;grid-column:span 12;min-width:0;position:relative}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}.c3{grid-column:span 3}
@media(max-width:1100px){.c4,.c3{grid-column:span 6}}
@media(max-width:820px){.c6,.c4,.c8,.c3{grid-column:span 12}}
.card h2{font-family:"Barlow Condensed";font-size:22px;font-weight:600;text-transform:uppercase;
  letter-spacing:.02em;margin:2px 0 0;line-height:1.05;text-wrap:balance}
.card .kick{composes:eyebrow}
.explain{display:grid;gap:3px;margin:10px 0 4px;padding:10px 12px;border-left:3px solid var(--line);
  background:var(--panel2);border-radius:0 10px 10px 0;font-size:12.8px;color:var(--ink2);line-height:1.5}
.explain b{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.15em;font-weight:500;

.note{font-size:13.5px;color:var(--ink2);margin:8px 0 4px;line-height:1.6;max-width:90ch}

h3.sect{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.2em;

/* ---------- tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);

/* ---------- charts ---------- */
.chart{position:relative;margin-top:8px}

.tooltip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--shadow);border-radius:10px;padding:8px 11px;font-size:12.5px;z-index:5;display:none;min-width:130px}
.tooltip .tt-x{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--mute);margin-bottom:4px}
.tooltip .row{display:flex;align-items:center;gap:7px;margin:2.5px 0}
.tooltip .key{width:12px;height:0;border-top:3px solid;border-radius:2px;flex:none}
.tooltip .v{font-weight:600;margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.legend .it{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:3px;border-radius:2px}
.legend .sw.rect{height:10px;border-radius:3px}
.tbl-toggle{position:absolute;top:16px;right:16px;font-family:"JetBrains Mono",monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);
  border-radius:8px;padding:4px 10px}

/* ---------- tables ---------- */
table.data{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}

  font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}

.scroll{overflow-x:auto}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:24px 20px;text-align:center;
  color:var(--mute);font-size:13.5px;margin:12px 0;line-height:1.6}

/* ---------- overview: today strip ---------- */
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:16px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:16px 18px;border-top:3px solid var(--ice)}

.tcard .when{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.tcard .big{font-family:"Barlow Condensed";font-size:21px;font-weight:600;text-transform:uppercase;margin:5px 0 3px;line-height:1.1}

/* ---------- readiness traffic-light banner ---------- */
.rbanner{border-radius:18px;padding:18px 20px;margin:2px 0 18px;border:1.6px solid;box-shadow:var(--shadow);

  font-family:"Barlow Condensed";font-weight:700;font-size:30px;line-height:1;flex:none;border:2.5px solid}
.rbanner .rb-main{min-width:0}

  text-transform:uppercase;color:var(--mute);margin-bottom:2px}

  text-transform:uppercase;letter-spacing:.02em;line-height:1}
.rbanner .rb-sub{font-size:14px;color:var(--ink2);margin-top:5px;line-height:1.5;max-width:70ch}
.rbanner .rb-reasons{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.rbanner .rb-chk{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.04em;
  border-radius:999px;padding:4px 11px;border:1px solid;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.rbanner .rb-chk .g{font-weight:700}
.rbanner .rb-chk.green{color:var(--good);border-color:var(--good);background:var(--goodbg)}
.rbanner .rb-chk.amber{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}

.rbanner.green{border-color:var(--good);background:var(--goodbg)}

.rbanner.amber{border-color:var(--warn);background:var(--warnbg)}

.rbanner.amber .rb-level{color:var(--warn)}
.rbanner.red{border-color:var(--bad);background:var(--badbg)}

@media(max-width:560px){.rbanner{padding:15px 15px}.rbanner .rb-dot{width:46px;height:46px;font-size:24px}}

/* colour-coded stat values (health tiles) */
.tile .val.good{color:var(--good)}.tile .val.warn{color:var(--warn)}.tile .val.bad{color:var(--bad)}
.tile .base{grid-column:1/2;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.05em;
  color:var(--mute);margin-top:3px}
.ov-sub{font-size:12.5px;color:var(--mute);margin:-6px 0 14px;line-height:1.5}

/* ---------- plan ---------- */
details.day{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--panel2);overflow:hidden}

details.day summary::-webkit-details-marker{display:none}

.day .dd{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--mute);width:64px;flex:none}
.day .dt{font-weight:600;font-size:14px;flex:1 1 200px}
.day .lane{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ice)}
.day .lane.star{color:var(--rosa)}
.day .dtss{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--mute)}
.day .body{padding:2px 14px 13px 90px;font-size:13px;color:var(--ink2);line-height:1.6}
@media(max-width:640px){.day .body{padding-left:14px}}
.day .caret{color:var(--mute);transition:transform .15s;flex:none}
details.day[open] .caret{transform:rotate(90deg)}
.stat-chip{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;border-radius:999px;
  padding:3px 9px;text-transform:uppercase;border:1px solid;flex:none}
details.wk-collapse{border:1px dashed var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
details.wk-collapse>summary{display:flex;gap:8px;align-items:center;padding:10px 13px;cursor:pointer;
  list-style:none;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute)}
details.wk-collapse>summary::-webkit-details-marker{display:none}
details.wk-collapse>summary:hover{color:var(--ink2)}
details.wk-collapse .caret{color:var(--mute);transition:transform .15s;flex:none}
details.wk-collapse[open] .caret{transform:rotate(90deg)}
details.wk-collapse>.body{padding:0 13px 4px}

/* ---------- verdicts / rules ---------- */
.v-item{margin-top:13px;padding-top:13px;border-top:1px solid var(--line2)}
.v-item:first-of-type{margin-top:8px;border-top:none;padding-top:0}
.v-item .t{font-weight:600;font-size:14px}
.v-item .why{font-size:12.8px;color:var(--ink2);margin-top:3px;line-height:1.55}
.v-item .do{font-size:12.8px;margin-top:5px;line-height:1.55;color:var(--ink)}
.v-item .do b{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.15em;font-weight:500}
.qa{border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-top:10px;background:var(--panel2)}
.qa .q{font-weight:600;font-size:14px}
.qa .q::before{content:"Q · ";color:var(--rosa);font-family:"JetBrains Mono",monospace;font-size:11px}
.qa .a{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.65}
.qa .a::before{content:"A · ";color:var(--ice);font-family:"JetBrains Mono",monospace;font-size:11px}
.actions{margin:8px 0 4px;padding:0;list-style:none}
.actions li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line2);font-size:14px;line-height:1.55}
.actions li:first-child{border-top:none}
.actions .pn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--rosabg);color:var(--rosa);
  font-family:"Barlow Condensed";font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.story p{margin:0 0 12px;color:var(--ink2);font-size:14.5px;line-height:1.7;max-width:88ch}
.story p:first-child{color:var(--ink);font-size:15.5px}
dl.gloss{margin:6px 0 0}
dl.gloss dt{font-weight:600;font-size:14px;margin-top:14px;font-variant-numeric:tabular-nums}
dl.gloss dt .mono{color:var(--ice);font-size:11px;letter-spacing:.08em}
dl.gloss dd{margin:3px 0 0;font-size:13.3px;color:var(--ink2);line-height:1.6;max-width:92ch}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-family:"JetBrains Mono",monospace;
  font-size:9.5px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;line-height:2}
abbr{text-decoration:underline dotted var(--mute);cursor:help}
</style>
<style>
#lock{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;
  justify-content:center;background:var(--page);padding:24px}

<body>
<div id="lock"><div class="box"><h1>Mark's Training Dashboard</h1><p>Enter your passphrase to unlock.</p><input id="pw" type="password" autocomplete="current-password" placeholder="Passphrase" enterkeyhint="go"><button id="go">Unlock</button><div class="row"><input id="rm" type="checkbox" checked><label for="rm">Remember on this device</label></div><div class="err" id="err"></div></div></div>

<div id="app"></div>
<script>
"use strict";
// The whole app runs inside __BOOT__ so its data can arrive either inlined at
// build time (Artifact build) or later at runtime (web build, after the
// encrypted payload is decrypted in the browser). Same code either way.
function __BOOT__(DATA){
const M=DATA.m,N=DATA.n||{headline:"",story:[],panel_notes:{},actions:[]},PLAN=DATA.plan||{weeks:[],phases:[]},COACH=DATA.coach||{};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS="http://www.w3.org/2000/svg";
const fmtN=(v,d=0)=>v==null?"–":Number(v).toLocaleString("en-GB",{maximumFractionDigits:d,minimumFractionDigits:0});
const el=(t,cls,txt)=>{const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const svgE=(t,at)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);return e;};
const dfmt=s=>{const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});};
const dfmtY=s=>{const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"2-digit"});};
const hms=s=>{if(s==null)return"–";const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h+":"+String(m).padStart(2,"0");};

/* ============ theme ============ */
const THEMES=["auto","light","dark"];
let themeIdx=Math.max(0,THEMES.indexOf(localStorage.getItem("hq-theme")||"auto"));
function applyTheme(){
  const t=THEMES[themeIdx];
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  localStorage.setItem("hq-theme",t);
  const b=document.querySelector(".theme-btn span.tt");
  if(b)b.textContent=t==="auto"?"Auto":t==="light"?"Light":"Dark";
  const ic=document.querySelector(".theme-btn span.ti");
  if(ic)ic.textContent=t==="auto"?"◐":t==="light"?"☀":"●";
}
/* ============ chart engine ============ */
function frame(w,h,pad){const svg=svgE("svg",{viewBox:`0 0 ${w} ${h}`,role:"img"});
  return{svg,w,h,pad,iw:w-pad.l-pad.r,ih:h-pad.t-pad.b};}
function niceTicks(lo,hi,n=4){if(hi===lo)hi=lo+1;
  const step0=(hi-lo)/n,mag=Math.pow(10,Math.floor(Math.log10(step0)));
  let step=mag;for(const m of[1,2,2.5,5,10])if(step0<=m*mag){step=m*mag;break;}
  const t0=Math.ceil(lo/step)*step,out=[];
  for(let v=t0;v<=hi+1e-9;v+=step)out.push(Math.round(v*1000)/1000);return out;}
function yAxis(f,lo,hi,fmt=fmtN){const ticks=niceTicks(lo,hi);
  const sy=v=>f.pad.t+f.ih-(v-lo)/(hi-lo)*f.ih;
  for(const t of ticks){const y=sy(t);
    f.svg.appendChild(svgE("line",{x1:f.pad.l,x2:f.w-f.pad.r,y1:y,y2:y,stroke:css("--line2"),"stroke-width":1}));
    const tx=svgE("text",{x:f.pad.l-8,y:y+4,"text-anchor":"end",fill:css("--mute"),"font-size":11,
      "font-family":"JetBrains Mono,monospace"});
    tx.textContent=fmt(t);f.svg.appendChild(tx);}
  return sy;}
function attachTooltip(d){const tt=el("div","tooltip");d.appendChild(tt);return tt;}
function showTT(tt,d,px,py,xLabel,rows){tt.innerHTML="";
  tt.appendChild(el("div","tt-x",xLabel));
  for(const r of rows){const row=el("div","row");
    const k=el("span","key");k.style.borderTopColor=r.color;row.appendChild(k);
    row.appendChild(el("span",null,r.name));row.appendChild(el("span","v",r.value));tt.appendChild(row);}
  tt.style.display="block";
  const bw=d.clientWidth,tw=tt.offsetWidth;
  tt.style.left=Math.min(Math.max(px+14,0),bw-tw-4)+"px";
  tt.style.top=Math.max(py-tt.offsetHeight-12,0)+"px";}
function lineChart(card,opts){
  const div=el("div","chart");card.appendChild(div);
  const W=opts.w||860,H=opts.h||280,pad={t:14,r:opts.padR||70,b:26,l:46};
  const f=frame(W,H,pad);div.appendChild(f.svg);
  const xs=opts.x,n=xs.length;if(!n)return div;
  opts.series=opts.series.filter(s=>s.values.some(v=>v!=null));
  if(!opts.series.length)return div;
  const xIsDate=typeof xs[0]==="string";
  const xv=xIsDate?xs.map(s=>new Date(s+"T00:00:00").getTime()):xs.slice();
  const x0=Math.min(...xv),x1=Math.max(...xv);
  const sx=v=>pad.l+(x1===x0?0.5:(v-x0)/(x1-x0))*f.iw;
  let lo=opts.y0!=null?opts.y0:Infinity,hi=-Infinity;
  for(const s of opts.series)for(const v of s.values)if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}
  if(!isFinite(lo))return div;
  const sp=(hi-lo)*.08||1;if(opts.y0==null)lo-=sp;hi+=sp;
  if(opts.refY!=null)hi=Math.max(hi,opts.refY+sp);
  const sy=yAxis(f,lo,hi,opts.yFmt);
  const nlab=Math.min(6,n),longSpan=xIsDate&&(x1-x0)>300*864e5;let lastX=-1e9;
  for(let i=0;i<nlab;i++){const idx=Math.round(i*(n-1)/(nlab-1||1)),lx=sx(xv[idx]);
    if(lx-lastX<(longSpan?76:52))continue;lastX=lx;
    const tx=svgE("text",{x:lx,y:H-8,"text-anchor":"middle",fill:css("--mute"),"font-size":11,
      "font-family":"JetBrains Mono,monospace"});
    tx.textContent=xIsDate?(longSpan?dfmtY(xs[idx]):dfmt(xs[idx])):opts.xFmt(xs[idx]);f.svg.appendChild(tx);}
  if(opts.zeroLine&&lo<0&&hi>0)
    f.svg.appendChild(svgE("line",{x1:pad.l,x2:W-pad.r,y1:sy(0),y2:sy(0),stroke:css("--line"),"stroke-width":1.4}));
  if(opts.refY!=null&&opts.refY>lo&&opts.refY<hi){
    f.svg.appendChild(svgE("line",{x1:pad.l,x2:W-pad.r,y1:sy(opts.refY),y2:sy(opts.refY),
      stroke:css("--rosa"),"stroke-width":1.2,"stroke-dasharray":"5 4"}));
    const t=svgE("text",{x:W-pad.r+4,y:sy(opts.refY)+4,fill:css("--rosa"),"font-size":10.5,
      "font-family":"JetBrains Mono,monospace"});t.textContent=opts.refLabel||"";f.svg.appendChild(t);}
  for(const s of opts.series){
    const pts=[];for(let i=0;i<n;i++)if(s.values[i]!=null)pts.push([sx(xv[i]),sy(s.values[i]),i]);
    if(!pts.length)continue;
    const gapMs=opts.noGapBreak?Infinity:90*864e5;
    const dAttr=pts.map((p,i)=>{const brk=i>0&&xIsDate&&(xv[p[2]]-xv[pts[i-1][2]])>gapMs;
      return((i===0||brk)?"M":"L")+p[0].toFixed(1)+" "+p[1].toFixed(1);}).join("");
    if(s.area){const a=dAttr+`L${pts[pts.length-1][0]} ${sy(Math.max(lo,0))}L${pts[0][0]} ${sy(Math.max(lo,0))}Z`;
      f.svg.appendChild(svgE("path",{d:a,fill:s.color,opacity:.1}));}
    if(s.width!==0)
      f.svg.appendChild(svgE("path",{d:dAttr,fill:"none",stroke:s.color,"stroke-width":s.width||2,
        "stroke-linejoin":"round","stroke-linecap":"round","stroke-dasharray":s.dash||"none"}));
    if(s.dots)for(const p of pts)
      f.svg.appendChild(svgE("circle",{cx:p[0],cy:p[1],r:4.5,fill:s.color,stroke:css("--panel"),"stroke-width":2}));
    if(opts.directLabels!==false){const lp=pts[pts.length-1];
      const t=svgE("text",{x:lp[0]+8,y:lp[1]+4,fill:css("--ink2"),"font-size":11.5,"font-weight":600});
      t.textContent=s.name;f.svg.appendChild(t);}}
  const hair=svgE("line",{y1:pad.t,y2:H-pad.b,stroke:css("--line"),"stroke-width":1,visibility:"hidden"});
  f.svg.appendChild(hair);
  const tt=attachTooltip(div);

/* Morning traffic light — the same four checks as the Health-tab framework
   (RHR vs baseline, HRV vs band, sleep, Garmin readiness score). Worst check
   sets the day's colour. Each check uses the most recent non-null reading so a
   missing HRV last night still reads yesterday's honestly, dated. */
function readinessAssess(){
  const bl=A.baselines||{},rhrB=bl.rhr||48,hrvL=bl.hrv_low||49,hrvH=bl.hrv_high||62;
  const hd=(M.health&&M.health.daily)||[];
  const rank={green:0,amber:1,red:2};
  const worse=(a,b)=>rank[a]>=rank[b]?a:b;
  const latest=f=>{for(let i=hd.length-1;i>=0;i--)if(hd[i][f]!=null)return{v:hd[i][f],date:hd[i].date};return null;};
  const checks=[];
  const rhr=latest("rhr");
  if(rhr){const d=rhr.v-rhrB,lvl=d<=4?"green":d<=8?"amber":"red";
    checks.push({lvl,label:"RHR "+rhr.v,detail:(d>=0?"+":"")+d+" vs "+rhrB,date:rhr.date});}
  const hrv=latest("hrv");
  if(hrv){const lvl=hrv.v>=hrvL?"green":hrv.v>=hrvL-7?"amber":"red";
    checks.push({lvl,label:"HRV "+hrv.v,detail:hrvL+"–"+hrvH+" band",date:hrv.date});}
  const slp=latest("sleep_h");
  if(slp){const lvl=slp.v>=7.5?"green":slp.v>=6.5?"amber":"red";
    checks.push({lvl,label:"Sleep "+fmtN(slp.v,1)+"h",detail:"≥7.5h green",date:slp.date});}
  const rd=latest("readiness");
  if(rd){const lvl=rd.v>=65?"green":rd.v>=40?"amber":"red";
    checks.push({lvl,label:"Readiness "+rd.v,detail:"/100",date:rd.date});}
  let level=checks.length?"green":null;
  checks.forEach(c=>level=worse(level,c.lvl));
  return {level,checks,rhrB,hrvL,hrvH,
    days_stale:(M.health&&M.health.days_stale)||0,
    last_date:(M.health&&M.health.last_date)||null,
    present:!!(M.health&&M.health.present&&checks.length)};
}

/* Auto-surface a health-feed warning. Fires the MOMENT ingest reports a token
   failure (feed_status !== "ok") — the athlete shouldn't have to wait for
   days_stale to creep to 2 to learn the metrics stopped pulling. Also fires on
   a genuinely stale feed (>=2 days behind) or a feed that never connected.
   A token failure is shown as a critical (red) banner; passive drift is amber.
   Silent only when the feed is live and current. */
function staleBanner(){
  const h=M.health||{};
  const stale=h.days_stale;
  const fs=h.feed_status;                       // "ok" | "token_expired" | "error" | undefined
  const feedBad=(fs!=null&&fs!=="ok");
  const drifted=(stale!=null&&stale>=2);
  const show=feedBad||(!h.present)||drifted;
  if(!show)return;
  /* Feed down, but the athlete has hand-entered readings up to today: the
     numbers below ARE current, so this is a plumbing warning, not a "you are
     blind" warning. Downgrade to amber and say what's actually true. */
  const bridged=feedBad&&h.manual_through&&h.manual_through===h.last_date&&!drifted;
  const crit=feedBad&&fs==="token_expired"&&!bridged;
  const bar=el("div","databar"+(crit?" crit":""));const win=el("div","wrap");const inn=el("div","databar-in");
  inn.appendChild(el("span","ic",crit?"⛔":"⚠"));
  const msg=el("div","msg");
  const since=h.feed_last_success?(" Last live reading "+dfmt(h.feed_last_success.slice(0,10))+"."):
    (h.last_date?(" Last health update "+dfmt(h.last_date)+"."):"");
  if(bridged){
    msg.innerHTML="<b>Garmin auto-sync still down — today’s numbers were entered by hand.</b> "+
      "The login token is expired, so nothing is pulling automatically, but readings through "+
      dfmt(h.manual_through)+" were filled in from Garmin Connect screenshots. The numbers below are current; "+
      "sleep stages, stress and body battery are missing because the app only shows summaries.";
  }else if(feedBad&&fs==="token_expired"){
    msg.innerHTML="<b>Garmin health feed DOWN — login token expired.</b> Morning HRV, sleep, resting HR and readiness have stopped pulling."+since+" Re-seed the Garmin token (tools/garmin-token/) to restore them; the readiness numbers below are last-known, not today’s.";
  }else if(feedBad){
    msg.innerHTML="<b>Garmin health feed error.</b> The last sync couldn’t pull health data"+(h.feed_message?" — "+h.feed_message:"")+". Readiness / HRV below are last-known, not today’s.";
  }else if(!h.present){
    msg.innerHTML="<b>Garmin health feed not connected.</b> Overnight HRV, sleep, resting HR and readiness aren’t flowing yet — re-authorise Garmin to populate the Health tab.";
  }else{
    msg.innerHTML="<b>Garmin feed stale.</b> Last health update "+dfmt(h.last_date)+" — "+stale+" day"+(stale===1?"":"s")+" ago. Morning HRV / sleep / RHR / readiness have stopped updating; the numbers below are last-known, not today’s.";
  }
  inn.appendChild(msg);
  inn.appendChild(el("div","fix",crit?"Re-seed Garmin token →":"Re-authorise Garmin →"));
  win.appendChild(inn);bar.appendChild(win);app.appendChild(bar);
}

  /* 3 — the health numbers that set the banner colour */

  const latestH=f=>{for(let i=hd.length-1;i>=0;i--)if(hd[i][f]!=null)return{v:hd[i][f],date:hd[i].date};return null;};
  const kh=el("div","kpis");v.appendChild(kh);
  function htile(lbl,valStr,cls,baseTxt,sparkVals,sparkColor){

  const cc=l=>l==="green"?"good":l==="amber"?"warn":"bad";
  if(M.health.present&&hd.length){
    const rd=latestH("readiness");
    if(rd)htile("Readiness",rd.v+"<small>/100</small>",cc(rd.v>=65?"green":rd.v>=40?"amber":"red"),
      "Garmin morning score",hd.map(d=>d.readiness),css("--s5"));
    const hrv=latestH("hrv");
    if(hrv)htile("HRV",hrv.v+"<small> ms</small>",cc(hrv.v>=hrvL?"green":hrv.v>=hrvL-7?"amber":"red"),
      "band "+hrvL+"–"+hrvH+" ms",hd.map(d=>d.hrv),css("--s5"));
    const rhr=latestH("rhr");
    if(rhr){const dl=rhr.v-rhrB;htile("Resting HR",rhr.v+"<small> bpm</small>",cc(dl<=4?"green":dl<=8?"amber":"red"),
      "baseline "+rhrB+" · "+(dl>=0?"+":"")+dl,hd.map(d=>d.rhr),css("--s2"));}
    const slp=latestH("sleep_h");
    if(slp)htile("Sleep",fmtN(slp.v,1)+"<small> h</small>",cc(slp.v>=7.5?"green":slp.v>=6.5?"amber":"red"),
      "target ≥7.5 h",hd.map(d=>d.sleep_h),css("--s1"));
    const bb=latestH("bb_high");
    if(bb)htile("Body battery",bb.v+"<small>/100</small>",cc(bb.v>=50?"green":bb.v>=25?"amber":"red"),
      "overnight peak",hd.map(d=>d.bb_high),css("--s4"));
    const str=latestH("stress_avg");
    if(str)htile("Stress",str.v+"",cc(str.v<=30?"green":str.v<=50?"amber":"red"),

    if(M.health.days_stale>=1){const n=el("div","ov-sub");

    e.textContent="Garmin health feed not connected yet — overnight HRV, resting HR, sleep and readiness land here once it's authorised. Meanwhile judge the day off your watch against baseline RHR "+rhrB+" / HRV "+hrvL+"–"+hrvH+" ms.";
    v.appendChild(e);}

  /* 4 — the fitness numbers + trend sparklines */
  v.appendChild(el("h3","sect disp","Fitness & form"));
  const pd=planToday(),nx=planNext(),lr=latestRide();
  const bits=[];
  if(pd)bits.push("<strong>Today:</strong> "+pd.title+(pd.tss?" (~"+pd.tss+" TSS)":""));
  if(nx&&(!pd||nx.date!==todayIso))bits.push("<strong>Next:</strong> "+dfmt(nx.date)+" — "+nx.title);
  if(lr)bits.push("<strong>Last ride:</strong> "+dfmt(lr.date)+" · "+fmtN(lr.km)+" km · "+(lr.np?"NP "+lr.np+" W · ":"")+fmtN(lr.tss)+" TSS"+(lr.flags&&lr.flags.length?" · ⚠ "+lr.flags[0]:""));
  if(bits.length){const s=el("div","ov-sub");s.style.margin="0 0 14px";s.innerHTML=bits.join(" &nbsp;·&nbsp; ");v.appendChild(s);}
  const k=el("div","kpis");v.appendChild(k);
  const last42=loadDaily.slice(-42);
  function tile(lbl,valHTML,sub,subCls,sparkVals,sparkColor){
    const t=el("div","tile");t.appendChild(el("div","lbl",lbl));
    const val=el("div","val disp");val.innerHTML=valHTML;t.appendChild(val);
    if(sparkVals&&sparkVals.filter(x=>x!=null).length>1){const s=spark(sparkVals,sparkColor||css("--s1"));t.appendChild(s);}
    if(sub)t.appendChild(el("div","sub"+(subCls?" "+subCls:""),sub));
    k.appendChild(t);}
  tile("Fitness · CTL",fmtN(cur.ctl),(cur.ramp_rate_wk>=0?"+":"")+fmtN(cur.ramp_rate_wk,1)+" per week ramp",
    cur.ramp_rate_wk>8?"warn":"",last42.map(d=>d.ctl));
  tile("Form · TSB",(cur.tsb>0?"+":"")+fmtN(cur.tsb),tsbState(cur.tsb)[0],tsbState(cur.tsb)[1]==="good"?"":tsbState(cur.tsb)[1],
    last42.map(d=>d.tsb),css("--s4"));
  tile("FTP",A.ftp+" <small>W · "+A.wkg_ftp+" W/kg</small>","Kickr ref · Favero ≈ Kickr (within ~2%)","",
    (A.ftp_history||[]).map(x=>x.ftp),css("--s5"));
  const wk=M.weekly[M.weekly.length-1]||{hours:0,tss:0,distance_km:0};
  tile("This week",fmtN(wk.hours,1)+" <small>h · "+fmtN(wk.tss)+" TSS</small>",fmtN(wk.distance_km)+" km ridden","",
    M.weekly.slice(-12).map(w=>w.tss),css("--s3"));
  const gap=vpLast?vpLast.gap_pct:null;
  tile("Valley gap",gap!=null?fmtN(gap,1)+"<small>%</small>":"–","flat vs climb watts at VT2 — the block KPI",
    gap!=null&&gap>-10?"good":"warn",vpw.map(w=>w.gap_pct),css("--s2"));

  /* goals row */
  v.appendChild(Object.assign(el("h3","sect disp","The three goals — live scoreboards")));
  const g=el("div","grid");v.appendChild(g);
  {const c=card(g,"c4","Goal 1 · block KPI","Valley power at VT2",
    [`Average watts while heart rate sits at ${A.vt2_bpm-5}–${A.vt2_bpm+5} bpm (around VT2 = ventilatory threshold 2, ${A.vt2_bpm} bpm — the highest intensity you can clear lactate at), split flat vs climb.`,
     "The gap should shrink toward 0% as the Tresenda→Sondalo flat sessions bite. If it's stuck after 4 weeks of flat-lane work, we change the session, not the goal."],"valley_power");
    if(!vpw.length)emptyState(c,"Needs rides with power + HR on both flat and climbing terrain.");
    else{lineChart(c,{x:vpw.map(w=>w.end_date),padR:74,h:210,
      series:[{name:"Climb W",color:css("--s4"),values:vpw.map(w=>w.climb_w)},
              {name:"Flat W",color:css("--s1"),values:vpw.map(w=>w.flat_w)}],unit:" W"});
      addTableToggle(c,()=>mkTable(["Window end","Flat W","Climb W","Gap","Flat min","Climb min"],
        vpw.map(w=>[dfmtY(w.end_date),w.flat_w,w.climb_w,(w.gap_pct>0?"+":"")+w.gap_pct+"%",w.flat_min,w.climb_min])));}}
  {const c=card(g,"c4","Goal 2 · accessory","Top-end sprint",
    ["Best 5 / 15 / 30-second power from each ride's power stream. Historical streams were too coarse for an honest 5 s number — new rides record at full resolution.",
     "Watch for new season-bests once weekly sprint sessions start (W3 of the plan). If 15 s power stays under ~450 W by September, add a second weekly dose."],"sprint");
    const st2=M.sprint.trend.filter(x=>x.p15||x.p5||x.p30);
    if(!st2.length)emptyState(c,"Appears as full-resolution streams accumulate.");
    else{lineChart(c,{x:st2.map(x=>x.date),padR:50,h:210,directLabels:false,
      series:[{name:"5 s",color:css("--s2"),values:st2.map(x=>x.p5),dots:true,width:0},
              {name:"15 s",color:css("--s3"),values:st2.map(x=>x.p15),dots:true,width:0},
              {name:"30 s",color:css("--s1"),values:st2.map(x=>x.p30),dots:true,width:0}],unit:" W"});
      addTableToggle(c,()=>mkTable(["Date","5s W","15s W","30s W","sample dt"],
        st2.slice(-20).map(x=>[dfmtY(x.date),x.p5,x.p15,x.p30,x.dt?x.dt+"s":"–"])));}}
  {const c=card(g,"c4","Goal 3 · the weapon","Fade less fast",
    ["Power drop from first to last climb on every ride with ≥3 climbs of ≥8 min. Bars below zero mean fading; the HR-adjusted number (table) strips out pacing.",
     "One multi-climb ride most weeks should keep this above −10%. A worsening trend under rising load = back off before it becomes overreach."],"repeatability");
    const rr=(M.repeatability.rides||[]).slice().reverse();
    if(!rr.length)emptyState(c,"Needs multi-climb rides — appears as streams are analysed.");
    else{colChart(c,{categories:rr.map(r=>r.date),values:rr.map(r=>r.fade_pct),h:210,
      colorFn:x=>x>=-2?css("--s1"):css("--s2"),name:"fade",unit:"%",yFmt:x=>((x>0?"+":"")+fmtN(x,1)),
      xFmt:dfmt,xFmtLong:(d)=>{const r=rr.find(y=>y.date===d);return dfmtY(d)+" — "+(r?r.name:"");}});
      addTableToggle(c,()=>mkTable(["Date","Ride","Climbs","Fade","HR-adjusted"],
        rr.map(r=>[dfmtY(r.date),r.name,r.n_climbs,(r.fade_pct>0?"+":"")+r.fade_pct+"%",
          r.hr_adj_fade_pct!=null?(r.hr_adj_fade_pct>0?"+":"")+r.hr_adj_fade_pct+"%":"–"])));}}

  /* do next + tab digests */
  const g2=el("div","grid");g2.style.marginTop="16px";v.appendChild(g2);
  if(N.actions&&N.actions.length){
    const c=card(g2,"c6","From the coach","Do next",null,null);
    const ul=el("ul","actions");
    N.actions.forEach(a=>{const li=el("li");li.appendChild(el("span","pn",String(a.priority)));
      li.appendChild(document.createTextNode(a.text));ul.appendChild(li);});
    c.appendChild(ul);}
  {const c=card(g2,"c6","Across the app","Tab digest",null,null);
    const rows=[
      ["Training Plan",(planNext()?("Next: "+dfmt(planNext().date)+" · "+planNext().title):"—")+((PLAN.weeks[0]&&PLAN.weeks[0].note)?"":"")],
      ["Load","CTL "+fmtN(cur.ctl)+" · TSB "+(cur.tsb>0?"+":"")+fmtN(cur.tsb)+" · week "+fmtN(wk.tss)+" TSS vs "+(PLAN.weeks[0]?PLAN.weeks[0].tss_target:"–")+" target"],
      ["Engine","Valley gap "+(gap!=null?gap+"%":"–")+" · best 15 s "+(M.sprint.best.p15||"–")+" W · FTP "+A.ftp+" W"],
      ["Health",M.health.present?("HRV "+((latestH("hrv")||{}).v||"–")+" ms · RHR "+((latestH("rhr")||{}).v||"–")+(M.health.days_stale>=1?" (last-known "+dfmt(M.health.last_date)+")":"")):"Garmin feed pending network allow-list"],
      ["Race",fmtN(M.countdown.days_to_go)+" days · est. race NP "+(mara&&mara.np_estimated?mara.np_estimated+" W":"–")+" · stopped time "+(mara?mara.stopped_min+" min":"–")],
      ["Coach",(COACH.qa&&COACH.qa.length?COACH.qa.length+" Q&A":"")+" · "+((COACH.verdicts&&COACH.verdicts.neglected)?COACH.verdicts.neglected.length+" neglected areas being fixed":"")]];
    const t=el("table","data");const tb=el("tbody");
    rows.forEach(r=>{const tr=el("tr");
      const td1=el("td",null,r[0]);td1.style.width="130px";tr.appendChild(td1);
      const td2=el("td",null,r[1]);td2.style.textAlign="left";td2.style.whiteSpace="normal";tr.appendChild(td2);
      tb.appendChild(tr);});
    t.appendChild(tb);c.appendChild(t);}
}

/* ============ PLAN ============ */
function stageProfile(container,phases,H=210){
  if(!phases.length)return;
  const W=1200,pad=30;
  const svg=svgE("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Training block profile"});
  const n=phases.length;
  const xs=phases.map((_,i)=>pad+i*(W-2*pad)/(n-1));
  const ys=phases.map(p=>H-pad-(p.h/100)*(H-2.6*pad));
  let d=`M ${pad} ${H-pad} L ${xs[0]} ${ys[0]}`;
  for(let i=1;i<n;i++){const mx=(xs[i-1]+xs[i])/2;
    d+=` C ${mx} ${ys[i-1]}, ${mx} ${ys[i]}, ${xs[i]} ${ys[i]}`;}
  svg.appendChild(svgE("path",{d:d+` L ${W-pad} ${H-pad} Z`,fill:css("--ice"),opacity:.08}));
  svg.appendChild(svgE("path",{d,fill:"none",stroke:css("--ice"),"stroke-width":2.5,"stroke-linejoin":"round"}));
  const act=phases.findIndex(p=>p.status==="active");
  phases.forEach((p,i)=>{
    svg.appendChild(svgE("line",{x1:xs[i],y1:ys[i],x2:xs[i],y2:H-pad,stroke:css("--line"),"stroke-dasharray":"2 4"}));
    svg.appendChild(svgE("circle",{cx:xs[i],cy:ys[i],r:i===act?7:4.5,
      fill:i===act?css("--rosa"):(p.status==="next"?css("--warn"):css("--panel")),
      stroke:i===act?css("--rosa"):css("--ice"),"stroke-width":1.6}));
    const anch=i===0?"start":(i===n-1?"end":"middle");
    const tx=i===0?Math.max(xs[i]-14,6):(i===n-1?Math.min(xs[i]+14,W-6):xs[i]);
    const t=svgE("text",{x:tx,y:ys[i]-(i===act?26:13),"text-anchor":anch,fill:css("--ink"),
      "font-size":16,"font-weight":600,"font-family":"Barlow Condensed"});
    t.textContent=p.name.toUpperCase();svg.appendChild(t);
    if(i===act){const yh=svgE("text",{x:tx,y:ys[i]-12,"text-anchor":anch,fill:css("--rosa"),
      "font-size":9.5,"letter-spacing":".14em","font-family":"JetBrains Mono,monospace"});
      yh.textContent="● YOU ARE HERE";svg.appendChild(yh);}
    const k=svgE("text",{x:xs[i],y:H-pad+16,"text-anchor":"middle",fill:css("--mute"),"font-size":9.5,
      "font-family":"JetBrains Mono,monospace"});
    k.textContent=p.key;svg.appendChild(k);});
  const div=el("div","chart");div.appendChild(svg);container.appendChild(div);}
function vPlan(v){
  const g=el("div","grid");v.appendChild(g);
  {const c=card(g,"","Jul ’26 → winter","The block as a stage profile",
    ["The whole campaign to Maratona 2027 drawn as a race profile — height is weekly training stress, the dot is where you are now.",
     "Check the active phase before reading any week below: a session only makes sense inside its phase's job. Gates (like the FTP retest) move on readiness, not the calendar."],null);
    stageProfile(c,PLAN.phases||[]);}
  if(PLAN.horizon_note){const n=el("div","note");n.textContent=PLAN.horizon_note;n.style.margin="4px 4px 0";v.appendChild(n);}
  if(PLAN.availability){const av=PLAN.availability;
    const c=card(g,"","when training happens","Availability & holidays",
      ["Your real weekly schedule — the plan is built to fit it, not the other way round.",
       "If a weekday morning falls through, shift the session earlier in the week rather than pushing it to the weekend; the weekend ride is always a bonus."],null);
    /* key info stays visible: the weekly pattern + upcoming trips at a glance */
    if(av.weekly_pattern)c.appendChild(el("div","note",av.weekly_pattern));
    const kindChip={trip:"ice",holiday:"rosa",travel:"warn"};
    const ups=(av.holidays||[]).filter(h=>!h.end||h.end>=todayIso);
    if(ups.length){c.appendChild(el("div","eyebrow","Upcoming trips & holidays"));}
    ups.forEach(h=>{const d=el("details","day");
      const sm=el("summary");sm.appendChild(el("span","caret","▸"));
      sm.appendChild(el("span","dd",dfmt(h.start)+" – "+dfmt(h.end)));
      sm.appendChild(el("span","dt",h.label||"Holiday"));
      sm.appendChild(chip(kindChip[h.kind]||"rosa",h.tag||"flexible / de-load"));
      d.appendChild(sm);d.appendChild(el("div","body",h.note));c.appendChild(d);});
    /* everything else folds away until you want it */
    const more=el("details","day");more.style.marginTop="10px";
    const ms=el("summary");ms.appendChild(el("span","caret","▸"));
    ms.appendChild(el("span","dt","More on the schedule — philosophy, summer & meters"));
    more.appendChild(ms);
    const mb=el("div","body");
    if(av.load_philosophy){const lp=el("p");lp.style.margin="0 0 10px";lp.innerHTML="<strong>Why it's not every day:</strong> "+av.load_philosophy;mb.appendChild(lp);}
    if(av.summer_window){const s=el("p");s.style.margin="0 0 10px";s.innerHTML="<strong>Summer (to 5 Sep):</strong> "+av.summer_window;mb.appendChild(s);}
    if(av.meter_note){const mn=el("p");mn.style.margin="0";mn.innerHTML="<strong>Meters:</strong> "+av.meter_note;mb.appendChild(mn);}
    more.appendChild(mb);c.appendChild(more);}
  const wkAct={};M.weekly.forEach(w=>wkAct[w.week_start]=w.tss);
  (PLAN.weeks||[]).forEach((w,wi)=>{
    const c=card(g,"",w.phase,w.label,null,null);
    c.style.borderTop="3px solid "+(wi===0?css("--rosa"):css("--line"));
    const hdr=el("div");hdr.style.cssText="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px";
    hdr.appendChild(chip("ice","Target ~"+w.tss_target+" TSS"));
    const act=wkAct[w.start];
    if(act!=null)hdr.appendChild(chip(act>=w.tss_target*.8?"good":"mute","Actual "+fmtN(act)+" TSS"));
    c.appendChild(hdr);
    /* A week whose last day is already in the past is done — the TSS chips
       above are the whole story, so the day-by-day breakdown collapses by
       default. Current/future weeks (which include today) stay expanded. */
    const days=w.days||[];
    const lastDate=days.length?days[days.length-1].date:w.start;
    const weekOver=lastDate&&lastDate<todayIso;
    let daysHost=c;
    if(weekOver){
      const coll=el("details","wk-collapse");
      const sm=el("summary");sm.appendChild(el("span","caret","▸"));
      sm.appendChild(document.createTextNode("Show "+days.length+" days"));
      coll.appendChild(sm);
      daysHost=el("div","body");coll.appendChild(daysHost);
      c.appendChild(coll);
    }
    days.forEach(d=>{
      const det=el("details","day");
      if(d.date===todayIso)det.open=true;
      const sm=el("summary");
      sm.appendChild(el("span","caret","▸"));
      sm.appendChild(el("span","dd",(d.dow||"")+" "+(d.date?dfmt(d.date):"")));
      sm.appendChild(el("span","dt",d.title));
      sm.appendChild(el("span","lane"+(/★/.test(d.lane||"")?" star":""),d.lane||""));
      if(d.tss)sm.appendChild(el("span","dtss","~"+d.tss+" TSS"+(d.duration_min?" · "+d.duration_min+" min":"")));
      let chipCls="ice",chipTxt="planned";
      if(d.status==="done"){chipCls="good";chipTxt=d.moved_from?"done · moved":"done";}
      else if(d.status==="moved"){chipCls="mute";chipTxt="moved";}
      else if(d.date===todayIso){chipCls="rosa";chipTxt="today";}
      else if(d.type==="rest"){chipCls="mute";chipTxt="rest";}
      else if(d.type==="optional"){chipCls="mute";chipTxt="optional";}
      else if(d.date<todayIso){chipCls="mute";chipTxt="past";}
      sm.appendChild(chip(chipCls,chipTxt));
      if(d.type==="rest"||d.type==="optional"||d.status==="moved")sm.style.opacity="0.72";
      det.appendChild(sm);
      const body=el("div","body",d.detail||"");det.appendChild(body);
      if(d.prescription)renderPrescription(body,d.prescription);
      daysHost.appendChild(det);});
    if(w.note){const n=el("div","note");n.textContent="◆ "+w.note;n.style.color="var(--warn)";c.appendChild(n);}});
}

function renderPrescription(container,p){
  const wrap=el("div");wrap.style.cssText="margin-top:11px;border-top:1px solid var(--line2);padding-top:10px";
  if(p.summary){const s=el("div");s.style.cssText="font-family:'Barlow Condensed';font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink)";s.textContent="▸ "+p.summary;wrap.appendChild(s);}
  if(p.meter){const m=el("div","eyebrow");m.textContent=p.meter;m.style.margin="3px 0 7px";wrap.appendChild(m);}
  const sc=el("div","scroll");const t=el("table","data");
  const tr=el("tr");["Step","Time","Power","HR","Cadence"].forEach(h=>tr.appendChild(el("th",null,h)));
  const th=el("thead");th.appendChild(tr);t.appendChild(th);
  const tb=el("tbody");
  (p.steps||[]).forEach(st=>{
    const r=el("tr");
    const nm=el("td",null,st.label||"");nm.style.fontWeight="600";r.appendChild(nm);
    r.appendChild(el("td",null,st.dur||"–"));
    const pw=el("td",null,st.power||"–");pw.style.color="var(--s1)";pw.style.fontWeight="600";r.appendChild(pw);
    const hr=el("td",null,st.hr||"–");hr.style.color="var(--s2)";r.appendChild(hr);
    r.appendChild(el("td",null,st.cadence||"–"));
    tb.appendChild(r);
    if(st.note){const rn=el("tr");const td=el("td",null,"↳ "+st.note);td.colSpan=5;
      td.style.cssText="color:var(--mute);font-size:12px;white-space:normal;text-align:left;padding:2px 9px 8px;font-weight:400";
      rn.appendChild(td);tb.appendChild(rn);}
  });
  t.appendChild(tb);sc.appendChild(t);wrap.appendChild(sc);
  if(p.fuel){const f=el("div");f.style.cssText="font-size:12.5px;color:var(--ink2);margin-top:7px";f.innerHTML="<b style='font-family:JetBrains Mono,monospace;font-size:9.5px;letter-spacing:.12em;color:var(--mute)'>FUEL </b>"+p.fuel;wrap.appendChild(f);}
  container.appendChild(wrap);
}

/* ============ LOAD ============ */
function vLoad(v){
  const g=el("div","grid");v.appendChild(g);
  {const c=card(g,"","42/7-day exponentially-weighted training stress","Fitness, fatigue & form",
    ["CTL (chronic training load, 'fitness') is your 42-day weighted average daily training stress; ATL (acute, 'fatigue') the 7-day; TSB (training stress balance, 'form') = fitness − fatigue.",
     "Hard training happens at TSB −10 to −25; racing at +5 to +20. Ramp CTL ≤ +5/wk. If TSB dives under −25 or HRV drops with it, the next hard day becomes easy — no exceptions."],"load");
    const days=loadDaily.filter(d=>d.date>=new Date(Date.now()-380*864e5).toISOString().slice(0,10));
    lineChart(c,{x:days.map(d=>d.date),padR:88,h:310,zeroLine:true,
      series:[{name:"Fitness",color:css("--s1"),values:days.map(d=>d.ctl),area:true},

    ask.innerHTML="<strong>Ask the coach.</strong> "+(COACH.ask_how||"");
    ask.style.cssText="border-top:1px solid var(--line);padding-top:12px;margin-top:14px";
    c.appendChild(ask);}
  const V=COACH.verdicts||{};
  [["Working — protect it",V.working,"--good"],["Cost you time — fix it",V.not_working,"--warn"],
   ["Neglected — the block's job",V.neglected,"--bad"]].forEach(([t,items,col])=>{
    if(!items||!items.length)return;
    const c=card(g,"c4",null,t,null,null);c.style.borderTop="3px solid "+css(col);
    items.forEach(it=>{const d=el("div","v-item");
      d.appendChild(el("div","t",it.t));d.appendChild(el("div","why",it.why));
      const doEl=el("div","do");const b=el("b",null,"DO → ");b.style.color=css(col);
      doEl.appendChild(b);doEl.appendChild(document.createTextNode(it.action));d.appendChild(doEl);
      c.appendChild(d);});});
  {const c=card(g,"","18 months, distilled","The rulebook",null,null);
    const grid=el("div");grid.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:12px";
    (COACH.rules||[]).forEach(r=>{const d=el("div");
      d.style.cssText="border-left:3px solid var(--ice);padding-left:12px";
      d.appendChild(el("div","t",r.t)).style.cssText="font-weight:600;font-size:13.5px";
      d.appendChild(el("div",null,r.why)).style.cssText="font-size:12.3px;color:var(--ink2);margin-top:2px;line-height:1.5";
      grid.appendChild(d);});
    c.appendChild(grid);}
  if(COACH.qa&&COACH.qa.length){
    const c=card(g,"","questions answered from the data","Coach Q&A",null,null);
    COACH.qa.slice().reverse().forEach(x=>{const d=el("div","qa");
      d.appendChild(el("div","q",x.q));d.appendChild(el("div","a",x.a));
      d.appendChild(el("div","eyebrow",dfmtY(x.date)));c.appendChild(d);});}
}

/* ============ REFERENCE ============ */
function vReference(v){
  const g=el("div","grid");v.appendChild(g);
  {const c=card(g,"c6","every acronym on this dashboard","Glossary",null,null);
    const dl=el("dl","gloss");
    [["CTL — chronic training load ('fitness')","Your 42-day exponentially-weighted average of daily training stress. Rises slowly with consistent work; this is the number the winter base block exists to raise (target: mid-60s at the 2027 taper)."],
     ["ATL — acute training load ('fatigue')","Same calculation over 7 days — what the last week cost you."],
     ["TSB — training stress balance ('form')","CTL − ATL. Negative = building under fatigue (productive at −10 to −25); positive = fresh (race at +5 to +20). Very positive for weeks = detraining."],
     ["TSS — training stress score","How much a session costs: 100 = one hour at full threshold effort. Computed from power where streams exist, calibrated from Strava's HR-based effort otherwise."],
     ["NP — normalised power","A weighted average power that counts surges and climbs the way your body does — always ≥ average power on a variable ride."],
     ["IF — intensity factor","NP ÷ FTP. 0.7 = endurance day, 0.85 = hard tempo/threshold, ~1.0 = time-trial effort."],
     ["FTP — functional threshold power",`The classic 'best-hour' power benchmark (${A.ftp} W, Kickr scale). Zones and TSS hang off it. Kickr = reference (indoor trainer). Since the 10 Jul recalibration the Favero pedals read within ~2% of Kickr (marginally higher, normal drivetrain loss) — effectively interchangeable.`],
     ["VT1 / VT2 — ventilatory thresholds",`Breathing landmarks from Tymewear. VT1 (${A.vt1_bpm} bpm/${A.vt1_w_kickr} W): all-day ceiling. VT2 (${A.vt2_bpm} bpm/${A.vt2_w_kickr} W): above it lactate accumulates — minutes, not hours. Race pacing anchors to the VT2 heart-rate ceiling.`],
     ["VAM — velocity ascended, m/hour","Climbing speed (vertical metres per hour). Meter-independent, which is why it reconstructs the corrupted race power honestly."],
     ["EF — efficiency factor","NP ÷ average HR on steady rides: watts per heartbeat. Rising EF at fixed HR = the aerobic engine growing."],
     ["HRV — heart-rate variability","Beat-to-beat variation overnight (band: 52–63 ms). Suppressed HRV = unabsorbed stress; the morning traffic light runs on it."],
     ["RHR — resting heart rate","Overnight minimum (baseline 45 bpm). A rising multi-day trend = back off before it becomes illness."],
     ["Fade index","Average power on the last climb ÷ first climb of a multi-climb ride, HR-adjusted. Goal 3 is keeping it above −10% deep into long days."],
     ["W/kg — watts per kilogram",`Power ÷ body mass (${A.wkg_ftp} at FTP today). The currency of climbing.`]]
    .forEach(([t,d])=>{dl.appendChild(el("dt",null,t));dl.appendChild(el("dd",null,d));});
    c.appendChild(dl);}
  {const c=card(g,"c6","how the numbers get here","Data pipeline",null,null);
    const dl=el("dl","gloss");
    [["Strava (live)","Rides, streams (power/HR/altitude at full resolution for <3 h rides), zones, FTP. Synced 06:45, 13:00, 20:30 Italy time; the dashboard republishes on every sync."],
     ["Garmin (pending network allow-list)","Overnight HRV, RHR, sleep, stress, body battery, weight, non-cycling training. Credentials staged securely outside the repo; blocked only by the environment's network policy."],
     ["Tymewear (pending network allow-list)","Ventilatory thresholds and breathing data. Same status; VT values entered at test time meanwhile."],
     ["The coach layer","On every sync the analysis, narrative, plan statuses and Q&A are rewritten by the coach model from the fresh metrics — the prose you read is generated from the numbers you see."],
     ["Honesty rules","Corrupted data is excluded and flagged, never presented as real (the 2026 Maratona file). Metrics that can't be computed honestly show as gaps. Short-power numbers state their sampling limits."]]
    .forEach(([t,d])=>{dl.appendChild(el("dt",null,t));dl.appendChild(el("dd",null,d));});
    c.appendChild(dl);}
}

/* ============ router ============ */
/* ============ CONDITIONS ============ */
function vConditions(v){
  const C=M.conditions||{rides:[],heat:{},present:false};
  const g=el("div","grid");v.appendChild(g);
  {const c=card(g,"","air temperature per ride — outdoor from the Strava head-unit, indoor entered by hand","Ride conditions",
    ["The temperature you actually rode in. Outdoor temps come free from your bike computer's sensor; indoor ones you tell the session (“indoor today: 25.5°C, 55% RH, 950 ppm CO₂”).",
     "Heat quietly taxes you — HR climbs at the same watts, so it inflates TSS and readiness cost. Use it to read a 'bad' session fairly: 32°C explains a high-HR ride better than lost fitness does."],null);
    const rr=(C.rides||[]).filter(r=>r.temp_c!=null);
    if(!rr.length)emptyState(c,"No ride conditions yet. Outdoor rides fill in automatically from the temperature stream; log indoor sessions via the app's Update button or by telling the session.");
    else{colChart(c,{categories:rr.map(r=>r.date),values:rr.map(r=>r.temp_c),h:230,
      colorFn:(x,i)=>rr[i].indoor?css("--s5"):css("--s1"),name:"temp",unit:" °C",
      xFmt:dfmt,xFmtLong:(d,i)=>dfmtY(d)+" — "+(rr[i].indoor?"indoor":"outdoor")+" — "+(rr[i].name||"")});
      const lg=el("div","legend");
      [["outdoor",css("--s1")],["indoor",css("--s5")]].forEach(([t,col])=>{
        const it=el("span","it");const sw=el("span","sw rect");sw.style.background=col;it.appendChild(sw);
        it.appendChild(document.createTextNode(t));lg.appendChild(it);});
      c.appendChild(lg);
      addTableToggle(c,()=>mkTable(["Date","Ride","In/out","Temp °C","Max","Humidity","CO₂","Wind","Cooling"],
        rr.slice().reverse().map(r=>[dfmtY(r.date),r.name,r.indoor?"indoor":"outdoor",r.temp_c,r.temp_c_max||"–",
          r.humidity_pct?r.humidity_pct+"%":"–",r.co2_ppm?r.co2_ppm+" ppm":"–",
          r.wind_kph?r.wind_kph+" kph":"–",r.cooling_note||"–"])));}}
  {const c=card(g,"c6","office readings you log per turbo session","Indoor environment",
    ["Temperature, humidity and CO₂ in your pain-cave. CO₂ in particular climbs in a closed room in winter and can blunt performance and lift perceived effort.",
     "If CO₂ creeps over ~1000–1200 ppm or humidity is high, crack a window / add a fan before blaming the legs. Track whether ventilation changes move your HR-at-power."],null);
    const ind=(C.rides||[]).filter(r=>r.indoor);
    if(!ind.length)emptyState(c,"No indoor sessions logged yet. Tell the session your office readings after a turbo ride — temp, humidity, CO₂ and fan/window setup — and they'll land here.");
    else{const sc=el("div","scroll");sc.appendChild(mkTable(["Date","Temp","Humidity","CO₂","Cooling"],
      ind.slice().reverse().map(r=>[dfmtY(r.date),r.temp_c!=null?r.temp_c+" °C":"–",
        r.humidity_pct?r.humidity_pct+"%":"–",r.co2_ppm?r.co2_ppm+" ppm":"–",r.cooling_note||"–"])));
      c.appendChild(sc);}}
  {const c=card(g,"c6","does heat cost you watts per heartbeat?","Heat vs performance",
    ["Each ride's efficiency — normalised power ÷ average HR (watts per heartbeat) — plotted against the temperature it was ridden in. A downward slope means heat is making your heart work harder for the same power.",
     "Once the trend is clear, it tells you how much of a hot-day performance drop is environment, not form — and how much cooling (fan, early starts) is worth."],null);
    const pts=(C.rides||[]).filter(r=>r.temp_c!=null&&r.w_per_bpm);
    if(pts.length<4)emptyState(c,"Needs a few more rides with power, heart rate AND a temperature reading. Building as you ride — outdoor rides add themselves; indoor ones need your office temp.");
    else{const sorted=pts.slice().sort((a,b)=>a.temp_c-b.temp_c);
      lineChart(c,{x:sorted.map(r=>r.temp_c),padR:44,h:230,directLabels:false,
        xFmt:x=>fmtN(x)+"°",yFmt:x=>fmtN(x,2),
        series:[{name:"W per heartbeat",color:css("--s2"),values:sorted.map(r=>r.w_per_bpm),dots:true,width:0}]});
      if(C.heat&&C.heat.slope_wbpm_per_c!=null)
        c.appendChild(el("div","note","Trend: "+C.heat.note+" ("+(C.heat.slope_wbpm_per_c>0?"+":"")+C.heat.slope_wbpm_per_c+" W/bpm per °C across "+C.heat.n+" rides)."));}}
  {const c=card(g,"","wind, yaw and watts-lost from myWindsock","Wind & aero",
    ["myWindsock appends wind speed, yaw angle, headwind % and watts-lost-to-wind to your Strava ride descriptions; the sync reads them from there — no extra login.",
     "Turn on myWindsock → Strava 'add report to activity' once, and outdoor rides start showing what the wind cost you, separating a hard day into legs vs conditions."],null);
    const wr=(C.rides||[]).filter(r=>!r.indoor&&(r.weather_impact_pct!=null||r.wind_kph!=null||r.headwind_pct!=null));
    if(!wr.length)emptyState(c,"myWindsock is now enabled (nice) — but the only report so far is on today's indoor ramp, where its GPS-based weather is spurious, so it's excluded. Your next OUTDOOR ride's report will populate this: Weather Impact %, headwind, air speed and wind.");
    else{const sc=el("div","scroll");sc.appendChild(mkTable(["Date","Ride","Weather impact","Headwind","Air speed","Wind","Temp"],
      wr.slice().reverse().map(r=>[dfmtY(r.date),r.name,
        r.weather_impact_pct!=null?(r.weather_impact_pct>0?"+":"")+r.weather_impact_pct+"%":"–",
        r.headwind_pct!=null?r.headwind_pct+"%":"–",
        r.air_speed_kph?r.air_speed_kph+" kph":"–",
        r.wind_kph?r.wind_kph+" kph":"–",
        r.temp_c!=null?r.temp_c+" °C":"–"])));c.appendChild(sc);}}
}

const VIEWS={overview:vOverview,plan:vPlan,load:vLoad,engine:vEngine,health:vHealth,conditions:vConditions,race:vRace,coach:vCoach,reference:vReference};
function render(){
  const id=(location.hash||"#overview").slice(1);
  const tab=VIEWS[id]?id:"overview";
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const view=document.getElementById("view");view.innerHTML="";
  VIEWS[tab](view);
  const dq=M.data_quality;
  const ft=el("footer");
  ft.appendChild(el("div",null,"Generated "+M.generated_at.replace("T"," ")+" · "+dq.activities+" activities · "+dq.streams+" streams · Strava ✓ · Garmin "+(M.health.present?"✓":"pending")+" · Tymewear "+((M.tymewear&&M.tymewear.present)?"✓":"pending")));
  ft.appendChild(el("div",null,"State the meter · Kickr ref / Favero ≈ Kickr (±2%) · Fade less fast"));
  view.appendChild(ft);
}
buildShell();applyTheme();render();
window.addEventListener("hashchange",render);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(THEMES[themeIdx]==="auto")render();});
}

<script>var BUILD_STAMP="ff1c7786837483c9";
(function(){
  var KEY_STORE="mtd.key.v1", $=function(s){return document.querySelector(s)};
  var lock=$("#lock"), input=$("#pw"), btn=$("#go"), err=$("#err"), remember=$("#rm");

  function b64d(s){var r=atob(s),a=new Uint8Array(r.length);
    for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
  function b64e(buf){var b=new Uint8Array(buf),s="";
    for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}

  // data.enc is cache-busted by BUILD_STAMP — but BUILD_STAMP is baked into this
  // page, so a cached index.html carries a stale stamp and happily re-fetches the
  // stale payload it already has. Nothing on the page would look wrong; it would
  // just quietly be yesterday's numbers. version.txt is fetched with no-store so
  // it always comes from the server: if it disagrees with our own stamp, THIS
  // document is stale and we reload past the cache. sessionStorage guards against
  // a reload loop if the two never converge.
  fetch("version.txt",{cache:"no-store"})
    .then(function(r){return r.ok?r.text():null})
    .then(function(v){
      if(!v)return; v=v.trim();
      if(!v||v===BUILD_STAMP)return;
      var k="mtd.reload."+v;
      try{if(sessionStorage.getItem(k))return; sessionStorage.setItem(k,"1")}catch(e){}
      location.replace(location.pathname+"?b="+encodeURIComponent(v));
    })
    .catch(function(){});

  var metaPromise=fetch("data.enc?v="+encodeURIComponent(BUILD_STAMP),{cache:"no-cache"})
    .then(function(r){if(!r.ok)throw new Error("payload "+r.status);return r.json()});

  function deriveKey(pass,meta){
    return crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",
        false,["deriveBits"])
      .then(function(base){
        return crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(meta.salt),
          iterations:meta.iter,hash:"SHA-256"},base,256)})
  }
  function decrypt(rawKey,meta){
    return crypto.subtle.importKey("raw",rawKey,"AES-GCM",false,["decrypt"])
      .then(function(k){return crypto.subtle.decrypt(
        {name:"AES-GCM",iv:b64d(meta.iv)},k,b64d(meta.ct))})
      .then(function(pt){return JSON.parse(new TextDecoder().decode(pt))})
  }
  function start(data){lock.remove();__BOOT__(data)}

  function attempt(rawKey,meta,fromStore){
    return decrypt(rawKey,meta).then(function(data){
      if(remember&&remember.checked)
        try{localStorage.setItem(KEY_STORE,b64e(rawKey))}catch(e){}
      start(data)
    }).catch(function(e){
      // A stored key that no longer decrypts means the passphrase was rotated.
      if(fromStore){try{localStorage.removeItem(KEY_STORE)}catch(e2){}
        lock.style.visibility="visible";return}
      throw e
    })
  }

  // Silent path: a remembered key opens straight into the dashboard.
  var stored=null; try{stored=localStorage.getItem(KEY_STORE)}catch(e){}
  if(stored){lock.style.visibility="hidden";
    metaPromise.then(function(meta){return attempt(b64d(stored).buffer,meta,true)})
      .catch(function(){lock.style.visibility="visible"})}

  function go(){
    var pass=input.value;
    if(!pass)return;
    btn.disabled=true;err.textContent="Unlocking…";
    metaPromise
      .then(function(meta){return deriveKey(pass,meta).then(function(rk){
        return attempt(rk,meta,false)})})
      .catch(function(e){
        err.textContent=(e&&/payload/.test(e.message))?
          "Could not load the data file.":"Wrong passphrase.";
        btn.disabled=false;input.select()})
  }
  btn.addEventListener("click",go);
  input.addEventListener("keydown",function(e){if(e.key==="Enter")go()});
  input.focus();
})();
</script>
